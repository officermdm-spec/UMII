<aside class="surface-card h-fit rounded-2xl p-4 text-sm lg:sticky lg:top-24">
  <div class="rounded-xl bg-gradient-to-r from-sky-50 to-violet-50 p-3">
    <p class="text-xs text-slate-500">Welcome back</p>
    <p class="mt-0.5 font-semibold text-slate-800">{{ user.first_name|default:user.username }}</p>
  </div>
  <nav class="mt-3 grid grid-cols-2 gap-1 text-slate-600 sm:grid-cols-4 lg:flex lg:flex-col">
    <a class="account-link" href="{% url 'customers:dashboard' %}">Dashboard</a>
    <a class="account-link" href="{% url 'customers:profile' %}">Profile</a>
    <a class="account-link" href="{% url 'customers:addresses' %}">Addresses</a>
    <a class="account-link" href="{% url 'orders_customer:list' %}">Orders</a>
    <a class="account-link" href="{% url 'returns_customer:list' %}">Returns</a>
    <a class="account-link" href="{% url 'reviews_customer:feedback' %}">Feedback</a>
    <form method="post" action="{% url 'customers:logout' %}">
      {% csrf_token %}
      <button class="account-link w-full text-left text-red-600">Logout</button>
    </form>
  </nav>
</aside>
