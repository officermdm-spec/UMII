{% load humanize %}
<article class="product-card group flex flex-col overflow-hidden rounded-xl">
  <div class="product-card-media relative">
  <a href="{{ product.get_absolute_url }}" class="relative block aspect-square overflow-hidden bg-gradient-to-br from-sky-50 to-violet-50">
    {% if product.cover_image %}
      <img src="{{ product.cover_image.url }}" alt="{{ product.name }}" class="product-image h-full w-full object-contain" loading="lazy" decoding="async" onerror="this.classList.add('hidden'); var f=this.nextElementSibling; if(f) f.classList.remove('hidden');">
      <div class="hidden flex h-full flex-col items-center justify-center text-slate-400">
        <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-white text-2xl shadow-sm">◇</span>
        <span class="mt-2 text-xs">No image</span>
      </div>
    {% else %}
      <div class="flex h-full flex-col items-center justify-center text-slate-400">
        <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-white text-2xl shadow-sm">◇</span>
        <span class="mt-2 text-xs">No image</span>
      </div>
    {% endif %}
  </a>
  </div>
  <div class="flex flex-1 flex-col gap-1.5 p-2.5 sm:p-4">
    <h3 class="font-semibold leading-snug text-slate-800"><a class="transition hover:text-brand-700" href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3>
    <div>{% include "components/product_price.html" with product=product size="sm" %}</div>
  </div>
</article>
