{% if is_paginated %}
  <nav class="mt-6 flex items-center justify-center gap-2 text-sm">
    {% if page_obj.has_previous %}
      <a class="btn-secondary px-3 py-2" href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}">Previous</a>
    {% endif %}
    <span class="px-2 text-slate-500">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="btn-secondary px-3 py-2" href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}">Next</a>
    {% endif %}
  </nav>
{% endif %}
