<header class="no-print flex items-center justify-between border-b border-slate-200 bg-white px-4 py-3 sm:px-6">
  <div class="flex items-center gap-3">
    <button type="button" class="rounded-lg border px-2 py-1 lg:hidden" data-sidebar-toggle aria-controls="staff-sidebar" aria-expanded="false">☰</button>
    <h1 class="text-base font-semibold sm:text-lg">{% block page_heading %}Operations{% endblock %}</h1>
  </div>
  <div class="flex items-center gap-3 text-sm">
    {% if staff_is_viewer %}<span class="rounded-full bg-amber-100 px-2 py-0.5 text-xs text-amber-800">Viewer</span>{% endif %}
    <a class="text-slate-500 hover:text-brand-700" href="{% url 'store:home' %}">View store</a>
    <span class="hidden text-slate-500 sm:inline">{{ request.user.get_full_name|default:request.user.username }}</span>
    <form method="post" action="{% url 'accounts:staff_logout' %}">
      {% csrf_token %}
      <button class="rounded-lg border border-slate-300 px-3 py-1.5 hover:bg-slate-50" type="submit">Logout</button>
    </form>
  </div>
</header>
