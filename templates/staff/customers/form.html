{% extends "staff/base.html" %}
{% block staff_title %}Customer{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold">Customer</h1>
<form method="post" class="mt-4 max-w-xl space-y-3 rounded-2xl border bg-white p-5">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div><label class="text-sm font-medium">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
  {% endfor %}
  <div class="no-print flex gap-3">
    <button class="rounded-lg bg-brand-600 px-4 py-2 text-white">Save</button>
    <a class="rounded-lg border px-4 py-2" href="{% url 'customers_staff:list' %}">Cancel</a>
  </div>
</form>
{% endblock %}
