<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FP Mart{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#c7e0fd',
              300: '#a8b8fc',
              400: '#8b7cf8',
              500: '#7a5af0',
              600: '#6b46e8',
              700: '#5834d4',
              800: '#4829b0',
              900: '#3a228c'
            }
          }
        }
      }
    }
  </script>
  {% load static %}
  <link rel="icon" href="{% static 'brand/favicon.ico' %}" sizes="any">
  <link rel="icon" type="image/png" href="{% static 'brand/favicon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'brand/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="site-body min-h-full font-sans text-slate-900 antialiased">
  {% block body %}{% endblock %}
  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
