{% extends "customers/base.html" %}
{% block store_title %}Confirm delete{% endblock %}
{% block account_content %}
<div class="max-w-lg rounded-2xl border bg-white p-6">
  <h1 class="text-xl font-semibold">Delete this address?</h1>
  <form method="post" class="mt-4 flex gap-3">
    {% csrf_token %}
    <button class="rounded-lg bg-red-600 px-4 py-2 text-white">Delete</button>
    <a class="rounded-lg border px-4 py-2" href="{% url 'customers:addresses' %}">Cancel</a>
  </form>
</div>
{% endblock %}
