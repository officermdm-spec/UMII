{% extends "customers/base.html" %}
{% block store_title %}Request return{% endblock %}
{% block account_content %}
<h1 class="text-2xl font-semibold">Return {{ order.order_number }}</h1>
<form method="post" enctype="multipart/form-data" class="mt-4 space-y-4 rounded-2xl border bg-white p-5">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for item in order.items.all %}
    <label class="flex items-center justify-between gap-3 rounded-lg border px-3 py-2 text-sm">
      <span><input type="checkbox" name="item" value="{{ item.pk }}" class="mr-2">{{ item.product_name }} ({{ item.sku }})</span>
      <input type="number" name="qty_{{ item.pk }}" min="1" max="{{ item.quantity }}" value="{{ item.quantity }}" class="w-20 rounded border px-2 py-1">
    </label>
  {% endfor %}
  <div><label class="text-sm font-medium">Reason</label>{{ form.reason }}</div>
  <div><label class="text-sm font-medium">Description</label>{{ form.description }}</div>
  <div>
    <label class="text-sm font-medium">Images</label>
    <input type="file" name="images" multiple class="mt-1 block w-full text-sm">
  </div>
  <button class="rounded-lg bg-brand-600 px-4 py-2 text-white">Submit return</button>
</form>
{% endblock %}
