{% extends "customers/base.html" %}
{% block store_title %}Write a review{% endblock %}
{% block account_content %}
<h1 class="text-2xl font-semibold">Review {{ item.product_name }}</h1>
<form method="post" class="mt-4 max-w-lg space-y-4 rounded-2xl border bg-white p-5">
  {% csrf_token %}
  {% for field in form %}
    <div><label class="text-sm font-medium">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
  {% endfor %}
  <button class="rounded-lg bg-brand-600 px-4 py-2 text-white">Submit review</button>
</form>
{% endblock %}
